; ============================================
;  阶段 0 · 只验证灯阵映射的最小固件
; ============================================

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; 用 USB 口看日志（TX=GPIO1 仍可用；RX=GPIO3 已被 I2S DMA 占用，只能发不能收）
monitor_speed = 115200

; —— 烧录串口：填你自己的设备号，换电脑/换 USB 口时改这里 ——
; 查设备号：ls /dev/tty.usbserial*   （macOS）
; upload_port  = /dev/tty.usbserial-XXXXXXX
upload_speed = 460800
; 若换回 115200 更稳，把这行改成 upload_speed = 115200

lib_deps =
    makuna/NeoPixelBus

build_flags =
    -std=gnu++11

; 若 lib_deps 解析失败，可在项目根目录执行成功后把版本钉住，例如：
;   makuna/NeoPixelBus @ ^2.8.0
